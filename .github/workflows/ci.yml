name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dopl
          POSTGRES_PASSWORD: dopl
          POSTGRES_DB: dopl
        ports: ["54320:5432"]
        options: >-
          --health-cmd "pg_isready -U dopl -d dopl"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Captures outgoing email; e2e reads confirmation links from its API.
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://dopl:dopl@localhost:54320/dopl
      DATABASE_URL_TEST: postgresql://dopl:dopl@localhost:54320/dopl_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^DOPL_ENCRYPTION_KEY=.*|DOPL_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          PGPASSWORD=dopl psql -h localhost -p 54320 -U dopl -d dopl -c "CREATE DATABASE dopl_test"
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Migrations match schema (no drift)
        run: pnpm db:drift
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: E2E smoke (seeded dev database)
        run: |
          pnpm db:seed
          pnpm --filter @dopl/web exec playwright install --with-deps chromium
          # The worker sends the emails (and webhooks) the intake tests wait for.
          pnpm --filter @dopl/worker exec tsx src/main.ts > worker.log 2>&1 &
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            worker.log

  images:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dopl-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/dopl-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
