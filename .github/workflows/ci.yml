name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dopl
          POSTGRES_PASSWORD: dopl
          POSTGRES_DB: dopl
        ports: ["54320:5432"]
        options: >-
          --health-cmd "pg_isready -U dopl -d dopl"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://dopl:dopl@localhost:54320/dopl
      DATABASE_URL_TEST: postgresql://dopl:dopl@localhost:54320/dopl_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^DOPL_ENCRYPTION_KEY=.*|DOPL_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          PGPASSWORD=dopl psql -h localhost -p 54320 -U dopl -d dopl -c "CREATE DATABASE dopl_test"
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Migrations match schema (no drift)
        run: pnpm db:drift
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
